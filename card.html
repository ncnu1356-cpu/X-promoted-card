<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="">
  <meta name="twitter:description" content="">
  <meta name="twitter:image" content="">
  <title>Promoted Card</title>
  <style>
    body { margin:0; background:#fff; font-family: system-ui; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { max-width:550px; border:1px solid #eef2f5; border-radius:20px; padding:12px 16px; background:white; }
    .header { display:flex; gap:12px; align-items:center; }
    .avatar { width:48px; height:48px; background:#1d9bf0; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; }
    .promoted { background:#eff3f4; border-radius:12px; padding:2px 8px; font-size:12px; margin-left:8px; }
    .text { margin:12px 0; }
    img { width:100%; border-radius:16px; margin:12px 0; }
    .cta { background:#1d9bf0; color:white; padding:8px 20px; border-radius:40px; text-decoration:none; display:inline-block; }
    .actions { display:flex; justify-content:space-between; margin-top:12px; color:#536471; }
    @media (prefers-color-scheme: dark) { body,.card { background:#000; } .card { border-color:#2f3336; } .text { color:#e7e9ea; } }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="avatar">📢</div>
    <div><strong>Your Brand</strong> <span style="color:#536471;">@yourhandle · Sponsored</span><span class="promoted">Promoted</span></div>
  </div>
  <div class="text" id="descText">Loading...</div>
  <img id="cardImage" src="" alt="Ad image">
  <a id="ctaLink" href="#" class="cta" target="_blank">Learn More →</a>
  <div class="actions"><span>💬 128</span><span>🔁 42</span><span>❤️ 1.2K</span><span>📤</span></div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  document.getElementById('descText').innerText = params.get('desc') || 'Special offer!';
  document.getElementById('cardImage').src = params.get('image') || 'https://via.placeholder.com/800x418';
  const cta = params.get('cta') || 'Learn More';
  const link = params.get('link') || '#';
  document.getElementById('ctaLink').innerText = cta + ' →';
  document.getElementById('ctaLink').href = link;
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', params.get('title') || 'Promoted');
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', params.get('desc') || '');
  document.querySelector('meta[name="twitter:image"]').setAttribute('content', params.get('image') || '');
  document.title = params.get('title') || 'Promoted';
</script>
</body>
</html>
