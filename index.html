<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>X Promoted Card Generator</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    input, textarea, button, select { width: 100%; padding: 8px; margin: 8px 0; }
    .link-box { background: #eef; padding: 10px; border-radius: 8px; word-break: break-all; }
    .media-hint { font-size: 12px; color: #666; margin-top: -5px; margin-bottom: 10px; }
    .preview-area { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 8px; display: none; }
    video, img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>📢 Create Your X Promoted Card</h1>
  <form id="cardForm">
    <label>Title (for preview)</label>
    <input type="text" id="title" placeholder="Summer Sale" required>

    <label>Description (tweet text)</label>
    <textarea id="desc" rows="3" placeholder="Get 50% off today!" required></textarea>

    <label>Media Type</label>
    <select id="mediaType">
      <option value="image">Photo / Image (Upload)</option>
      <option value="video">Video (Upload - Auto Play)</option>
    </select>

    <label>Upload Media (Photo or Video)</label>
    <input type="file" id="mediaFile" accept="image/*,video/mp4,video/mov,video/avi">
    <div class="media-hint">📸 Image: JPG, PNG, GIF | 🎥 Video: MP4 (10MB tak)</div>

    <div id="previewArea" class="preview-area">
      <p>Preview:</p>
      <div id="previewContent"></div>
    </div>

    <label>Destination link (where people go when they click)</label>
    <input type="url" id="link" placeholder="https://yoursite.com/sale" required>

    <label>Button text (e.g., Shop Now)</label>
    <input type="text" id="cta" value="Learn More" required>

    <button type="submit">Generate X Card Link</button>
  </form>

  <div id="result" style="display:none; margin-top: 2rem;">
    <h3>✅ Copy this link and paste it into X.com (Twitter)</h3>
    <div class="link-box" id="cardLink"></div>
    <p>When you paste it on X, you'll see a promoted ad preview.</p>
  </div>

  <script>
    let API_URL = "https://x-promoted-card.vercel.app/api/card";
    let uploadedMediaUrl = "";

    // Preview functionality
    const mediaFile = document.getElementById('mediaFile');
    const previewArea = document.getElementById('previewArea');
    const previewContent = document.getElementById('previewContent');
    const mediaType = document.getElementById('mediaType');

    mediaFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const url = URL.createObjectURL(file);
      const type = mediaType.value;
      
      previewArea.style.display = 'block';
      
      if (type === 'image') {
        previewContent.innerHTML = `<img src="${url}" style="max-width:100%; max-height:200px;">`;
      } else {
        previewContent.innerHTML = `<video src="${url}" controls style="max-width:100%; max-height:200px;"></video>`;
      }
      
      // Convert to base64 or store for later
      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedMediaUrl = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('cardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!uploadedMediaUrl) {
        alert("Please upload a media file first!");
        return;
      }
      
      const title = encodeURIComponent(document.getElementById('title').value);
      const desc = encodeURIComponent(document.getElementById('desc').value);
      const mediaTypeValue = mediaType.value;
      const link = encodeURIComponent(document.getElementById('link').value);
      const cta = encodeURIComponent(document.getElementById('cta').value);
      const mediaData = encodeURIComponent(uploadedMediaUrl);
      
      const cardUrl = `${API_URL}?title=${title}&desc=${desc}&mediaType=${mediaTypeValue}&mediaData=${mediaData}&link=${link}&cta=${cta}`;
      document.getElementById('cardLink').innerText = cardUrl;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
